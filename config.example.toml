# Copy to ~/.config/lightrs/config.toml

provider = "kimi"           # glm | kimi | minimax
model = ""                  # empty = provider default
# fallback_model = ""       # retried once when the primary model errors
# weak_model = ""           # cheaper model for read-only steps; escalates to `model` on write/exec
# thinking = "high"         # sent verbatim as `reasoning_effort` (low|medium|high);
                           # providers without support may ignore or reject it — opt-in
base_url = ""               # empty = built-in default
workdir = "."               # agent file/shell scope

# Optional TUI palette: mocha (default) or hc
# [tui]
# theme = "mocha"

[keys]
# glm = "..."
# kimi = "..."
# minimax = "..."

# Optional: per-provider base-url overrides when a key targets a non-default
# endpoint (e.g. Kimi Code plan vs pay-as-you-go Moonshot). Applies to the
# startup provider's base_url, `/model <provider>` switches, and the `/model`
# list fetch.
# [endpoints]
# kimi = "https://api.kimi.ai/coding/v1"   # Kimi Code (global)
# kimi = "https://api.kimi.com/coding/v1"  # Kimi Code (China)
# kimi = "https://api.moonshot.cn/v1"      # Moonshot pay-as-you-go (China)
# minimax = "https://api.minimaxi.com/v1"  # MiniMax CN (coding-plan keys)

# Optional: restrict and/or confirm run_command before execution
# [shell]
# allowlist = ["cargo ", "git ", "rustc ", "ls", "pwd"]  # empty = allow all prefixes
# require_approval = true   # prompt y/n for every run_command (in addition to allowlist blocks)
# format_command = "cargo fmt -- {path}"  # formatter run after each write/edit; {path} = edited file
# test_command = "cargo test"  # run after write/edit tools; failures go back to the model
# heal_steps = 3               # max test_command runs per user turn

# Optional: agent skills (SKILL.md trees from OpenCode/Cursor/Claude/pi/Codex)
# [skills]
# enabled = true
# paths = ["/extra/skill/root"]

# Optional: OS sandbox for spawned commands (run_command, format/test hooks,
# [mcp.*]/[lsp.*] servers) — macOS seatbelt, Linux bwrap, fail-closed if no
# backend. File tools are already workdir-scoped in-process.
# [sandbox]
# on = true                                     # default false
# writable = ["~/.cargo", "~/.rustup", "~/.npm"]  # toolchain caches that need writes
# network = true                                # false = no outbound net for spawned commands

# Optional: extra directories the agent may READ (never write) beyond the
# workdir — read_file/list_dir/grep/glob/lsp paths resolve against these too.
# Global file only (a project overlay can't widen its own read scope);
# `--add-dir <path>` does the same per launch.
# extra_read_dirs = ["~/libs", "/opt/reference"]

# Optional: stdio MCP servers — spawned lazily on first `mcp_call` (newline
# JSON-RPC; omit `tool` in mcp_call args to list a server's tools first).
# [mcp.filesystem]
# command = "npx -y @modelcontextprotocol/server-filesystem /tmp"

# Optional: stdio language servers — spawned lazily on first `lsp` call.
# `extensions` routes a file to this server (the model passes only a path).
# [lsp.rust]
# command = "rust-analyzer"
# extensions = ["rs"]

# ──────────────────────────────────────────────────────────────
# Per-project overlay: <workdir>/.lightrs/config.toml — applies ONLY to
# workdirs listed under [trust].dirs below (or after in-TUI `/trust`, or a
# one-off `--trust`). Untrusted projects are skipped with a startup notice.
# Same schema; only model, fallback_model, weak_model, thinking, [shell],
# [mcp.*], and [lsp.*] are applied (a project [shell] replaces the global one
# entirely; mcp/lsp entries merge — same-name project wins).
# provider / base_url / keys / workdir are ignored in the project file.
# Precedence: CLI flags > project overlay > this global file.

# [trust]
# dirs = ["/path/to/repo"]  # canonical workdir paths allowed a project overlay
# Copy to ~/.config/lightrs/config.toml

provider = "kimi"           # glm | kimi | minimax
model = ""                  # empty = provider default
# fallback_model = ""       # retried once when the primary model errors
base_url = ""               # empty = built-in default
workdir = "."               # agent file/shell scope

# Optional TUI palette: mocha (default) or hc
# [tui]
# theme = "mocha"

[keys]
# glm = "..."
# kimi = "..."
# minimax = "..."

# Optional: restrict and/or confirm run_command before execution
# [shell]
# allowlist = ["cargo ", "git ", "rustc ", "ls", "pwd"]  # empty = allow all prefixes
# require_approval = true   # prompt y/n for every run_command (in addition to allowlist blocks)
# test_command = "cargo test"  # run after write/edit tools; failures go back to the model
# heal_steps = 3               # max test_command runs per user turn

# Optional: agent skills (SKILL.md trees from OpenCode/Cursor/Claude/pi/Codex)
# [skills]
# enabled = true
# paths = ["/extra/skill/root"]

# ──────────────────────────────────────────────────────────────
# Per-project overlay: <workdir>/.lightrs/config.toml
# Same schema; only model, fallback_model, and [shell] are applied
# (a project [shell] replaces the global one entirely).
# provider / base_url / keys / workdir are ignored in the project file.
# Precedence: CLI flags > project overlay > this global file.
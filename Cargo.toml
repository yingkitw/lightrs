[package]
name = "lightrs"
version = "0.1.0"
edition = "2024"
description = "Lightweight TUI coding agent (GLM, Kimi, MiniMax)"
license = "MIT"

[lib]
name = "lightrs"
path = "src/lib.rs"

[[bin]]
name = "lightrs"
path = "src/main.rs"

[features]
default = ["acp", "acp-v2"]
# TUI-only build: `cargo build --no-default-features`
acp = ["dep:agent-client-protocol"]
acp-v2 = ["acp", "agent-client-protocol?/unstable_protocol_v2"]

[dependencies]
agent-client-protocol = { version = "5", features = ["stdio"], optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync"] }
toml = "1"
[package]
name = "lightrs"
version = "0.1.0"
edition = "2024"
description = "Lightweight TUI coding agent (GLM, Kimi, MiniMax)"
license = "Apache-2.0"
authors = ["Ying Kit WONG"]

[lib]
name = "lightrs"
path = "src/lib.rs"

[[bin]]
name = "lightrs"
path = "src/main.rs"

[features]
default = ["syntect"]
# Same as pre-0.2 default binary (TUI + ACP + syntect): `cargo build --release --features full`
full = ["acp", "acp-v2", "syntect"]
# Smallest TUI: `cargo build --release --no-default-features`
acp = ["dep:agent-client-protocol"]
acp-v2 = ["acp", "agent-client-protocol?/unstable_protocol_v2"]
syntect = ["dep:syntect"]

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"

[dependencies]
agent-client-protocol = { version = "5", default-features = false, features = ["stdio"], optional = true }
anyhow = "1"
clap = { version = "4", default-features = false, features = ["derive", "env", "std", "help", "usage", "error-context"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"], optional = true }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "time"] }
toml = "1"
[package]
name = "lightrs"
version = "0.1.0"
edition = "2024"
description = "Lightweight TUI coding agent (GLM, Kimi, MiniMax)"
license = "MIT"

[[bin]]
name = "lightrs"
path = "src/main.rs"

[features]
default = ["acp-v2"]
acp-v2 = ["agent-client-protocol/unstable_protocol_v2"]

[dependencies]
agent-client-protocol = { version = "5", features = ["stdio"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
directories = "5"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
toml = "0.8"
